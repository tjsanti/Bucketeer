<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F2F6F8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F171E" media="(prefers-color-scheme: dark)">
    <title>Bucketeer</title>
    <link rel="preload" href="/ui/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/ui/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/ui/styles.css">
    <script src="/ui/theme.js"></script>
    <script type="module" src="/ui/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="/" aria-label="Bucketeer home">
        <span class="glyph" aria-hidden="true"><svg viewBox="0 0 32 36" width="20" height="22"><path d="M8 12V9a8 8 0 0 1 16 0v3M3 12h26l-4 21H7Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M11 22h10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>
        <span>Bucketeer</span>
      </a>
      <span class="masthead-note">A place for your money.</span>
      <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
        <svg class="icon i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"/></svg>
        <svg class="icon i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </header>
    <main class="workspace card">
      <nav class="budgets" aria-labelledby="budgets-heading">
        <div class="section-heading"><h2 id="budgets-heading">Your budgets</h2><button id="new-budget" class="btn btn-secondary btn-sm" type="button">+ New</button></div>
        <p id="list-message" role="status">Loading budgets...</p>
        <ul id="budget-list"></ul>
      </nav>
      <section class="editor" aria-labelledby="editor-heading">
        <div class="editor-top"><span class="eyebrow" id="editor-state">GETTING STARTED</span><span class="bucket-mark" aria-hidden="true"></span></div>
        <h1 id="editor-heading">Start a budget.</h1>
        <p class="intro" id="editor-description">Give it a name. You can save it now and pick it up whenever you need.</p>
        <form id="budget-form">
          <label for="budget-name">Budget name</label>
          <input id="budget-name" class="input" name="name" type="text" placeholder="e.g. Household" autocomplete="off" required>
          <div class="save-row"><button class="btn btn-primary" type="submit" id="save-budget">Save budget</button><p id="save-message" class="status" role="status" aria-live="polite"></p></div>
        </form>
        <p id="error-message" class="notice-error" role="alert" hidden></p>
        <dl id="budget-details" hidden><div><dt>Created</dt><dd id="created-at"></dd></div><div><dt>Last saved</dt><dd id="updated-at"></dd></div></dl>
      </section>
    </main>
  </body>
</html>
