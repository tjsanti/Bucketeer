<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F2F6F8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F171E" media="(prefers-color-scheme: dark)">
    <title>Bucketeer</title>
    <link rel="preload" href="/ui/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/ui/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/ui/styles.css">
    <script src="/ui/theme.js"></script>
    <script type="module" src="/ui/app.js"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4.8 11h14.4l-1.5 8.3a2 2 0 0 1-2 1.7H8.3a2 2 0 0 1-2-1.7L4.8 11Z" fill="currentColor" stroke="none"/><path d="M9 3.2v3.2M12 2v5M15 3.2v3.2" stroke-width="2"/></symbol>
      <symbol id="i-bank" viewBox="0 0 24 24"><path d="M3.5 9.5 12 4l8.5 5.5"/><path d="M5.5 10v7M10 10v7M14 10v7M18.5 10v7M3.5 20h17"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.1"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></symbol>
    </svg>
    <div class="app">
      <aside class="side">
        <div class="side-inner">
          <a class="wordmark" href="/" aria-label="Bucketeer home">
            <span class="glyph" aria-hidden="true"><svg class="icon"><use href="#i-logo"/></svg></span>
            <span>Bucketeer</span>
          </a>
          <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
            <svg class="icon i-moon" aria-hidden="true"><use href="#i-moon"/></svg>
            <svg class="icon i-sun" aria-hidden="true"><use href="#i-sun"/></svg>
          </button>
          <div class="budget-wrap" id="budget-wrap" hidden>
            <button id="budget-button" class="budget-switch" type="button" aria-expanded="false" aria-controls="budget-menu">
              <span class="bs-text"><small>Budget</small><span class="bs-name" id="budget-label"></span></span>
              <svg class="icon sm muted" aria-hidden="true"><use href="#i-down"/></svg>
            </button>
            <div class="menu" id="budget-menu" hidden>
              <ul class="menu-list" id="budget-list"></ul>
              <div class="menu-sep" role="separator"></div>
              <ul class="menu-list">
                <li><button class="menu-item" type="button" id="menu-new">New budget</button></li>
                <li><button class="menu-item" type="button" id="menu-rename">Rename budget</button></li>
              </ul>
            </div>
          </div>
          <nav class="nav" id="nav" aria-label="Main" hidden>
            <a id="nav-accounts" href="/" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-bank"/></svg>Accounts</a>
          </nav>
          <section class="accounts" id="side-accounts" aria-labelledby="side-label" hidden>
            <p class="side-label" id="side-label">Accounts</p>
            <ul class="acct-list num" id="side-list"></ul>
          </section>
        </div>
      </aside>
      <main id="main" tabindex="-1" aria-busy="true"></main>
    </div>
    <div class="snack" id="snack" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>
      <span class="msg" id="snack-msg"></span>
      <button type="button" id="snack-undo">Undo</button>
      <button type="button" class="x" id="snack-x" aria-label="Dismiss"><svg class="icon sm" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="sr-only" id="announce" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
